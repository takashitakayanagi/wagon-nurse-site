<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ページの移動中｜看護師国試対策WAGON</title>
<meta name="robots" content="noindex">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FXKCWMXKJB"></script>
<script>
  // 旧URLの転送。GitHub Pagesはサーバー側リダイレクトを持たないため、
  // このページ自体を転送用に置いている（詳細は site/_redirects の冒頭）。
  //
  // 2026-09-05にこの転送用HTMLを置いてから、フォームへの遷移がGA4から
  // 消えていた（それ以前は該当URLが404で、タグの入った404.htmlが拾っていた）。
  // 転送先はGoogleフォームの別ドメインで追えないので、ここで1回だけ計測してから転送する。
  (function () {
    var t = 'https://forms.gle/7LSEeqduxJ3G8mfy9';
    var moved = false;
    // replace＝履歴を汚さないので、戻るボタンで元の場所に戻れる
    function go() { if (moved) return; moved = true; location.replace(t); }

    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-FXKCWMXKJB');
    gtag('event', 'form_open', {
      form_name: 'venue_seminar',
      event_callback: go,  // 送信できたら即座に転送する
      event_timeout: 800   // 応答が返らなくても800msで転送する
    });

    // gtag.js がブロックされていると event_callback は呼ばれないため、
    // ここで必ず転送する。計測は落としても転送は落とさない。
    setTimeout(go, 900);
  })();
</script>
<meta http-equiv="refresh" content="2; url=https://forms.gle/7LSEeqduxJ3G8mfy9">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
         color:#1b2a3a; background:#fff; line-height:1.9; }
  main { padding:24px; text-align:center; }
  a { color:#0b6e8f; }
</style>
</head>
<body>
<main>
  <p>ページの場所が変わりました。自動で移動します。</p>
  <p>移動しない場合は <a href="https://forms.gle/7LSEeqduxJ3G8mfy9">対面講義のお申し込みフォーム</a> を開いてください。</p>
</main>
</body>
</html>
