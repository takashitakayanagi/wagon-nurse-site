<style>
:root{
  --bg:#F3F8FA; --card:#FFFFFF; --ink:#1B3A56; --ink-soft:#4F6478; --ink-dim:#8597A8;
  --line:#E3ECF1; --grad-a:#1878C4; --grad-b:#17C7C2; --sky:#4EC6EC; --sky-soft:#EAF7FC;
  --peach:#FFF1E6; --peach-ink:#C8702E; --marker:#FFF3A3;
  --line-g:#06C755; --line-g2:#05B04B;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  font-weight:500; line-height:1.8; -webkit-font-smoothing:antialiased;
  line-break:strict; overflow-wrap:break-word;
  min-height:100svh;
}
button{font:inherit; color:inherit;}
.wrap{max-width:480px; margin:0 auto; padding:0 16px calc(32px + env(safe-area-inset-bottom));}
.nb{display:inline-block;}  /* 文節を途中で折り返さない */

/* ── ヘッダ ── */
.top{padding:14px 0 6px; display:flex; justify-content:center;}
.top img{height:22px; width:auto;}

/* ── 共通カード ── */
.card{
  background:var(--card); border-radius:24px; padding:26px 20px;
  box-shadow:0 1px 0 var(--line), 0 10px 30px rgba(27,58,86,.06);
}
[hidden]{display:none !important;}
.screen{animation:fade .35s ease both;}
@keyframes fade{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}

/* ── はじめの画面 ── */
.intro{text-align:center; padding-top:18px;}
.blob{
  width:132px; height:132px; margin:6px auto 14px; border-radius:50%;
  background:linear-gradient(135deg,#DDF2FB,#DDF7F4); display:grid; place-items:center;
}
.intro .eyebrow{font-size:13px; color:var(--grad-a); font-weight:700; letter-spacing:.06em; margin:0;}
.intro h1{font-size:26px; line-height:1.5; font-weight:900; margin:6px 0 12px;}
.intro h1 .hl{background:linear-gradient(transparent 62%, var(--marker) 62%);}
.intro .lead{font-size:15px; color:var(--ink-soft); margin:0 0 22px;}
.chips{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:24px;}
.chips span{font-size:12.5px; background:var(--sky-soft); color:var(--grad-a); border-radius:999px; padding:4px 12px; font-weight:700;}

.btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  border:0; border-radius:999px; padding:17px 20px; font-size:17px; font-weight:700;
  cursor:pointer; text-decoration:none; transition:transform .12s ease, filter .12s ease;
}
.btn:active{transform:scale(.98);}
.btn.main{background:linear-gradient(90deg,var(--grad-a),var(--grad-b)); color:#fff; box-shadow:0 8px 20px rgba(24,120,196,.25);}
.btn.line{background:var(--line-g); color:#fff; box-shadow:0 8px 20px rgba(6,199,85,.25);}
.btn.line:active{background:var(--line-g2);}
.btn.ghost{background:transparent; color:var(--ink-soft); font-size:14px; padding:12px; font-weight:500;}
.note{font-size:12.5px; color:var(--ink-dim); margin:12px 0 0; text-align:center;}

/* ── 質問 ── */
.qtop{display:flex; align-items:center; gap:12px; padding:8px 0 16px;}
.back{
  flex:none; width:36px; height:36px; border-radius:50%; border:0; background:#fff;
  box-shadow:0 1px 0 var(--line); display:grid; place-items:center; cursor:pointer;
}
.back:disabled{visibility:hidden;}
.bar{flex:1; height:8px; background:#E1EAEF; border-radius:999px; overflow:hidden;}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--grad-a),var(--grad-b)); border-radius:999px; transition:width .35s ease;}
.count{flex:none; font-size:13px; color:var(--ink-dim); font-variant-numeric:tabular-nums; min-width:36px; text-align:right;}

.q .num{font-size:13px; font-weight:700; color:var(--grad-a); margin:0 0 4px;}
.q h2{font-size:21px; line-height:1.55; font-weight:900; margin:0 0 6px;}
.q .sub{font-size:13px; color:var(--ink-dim); margin:0 0 4px;}
.opts{display:grid; gap:10px; margin-top:18px;}
.opts.grid2{grid-template-columns:1fr 1fr;}
.opt{
  text-align:left; border:2px solid var(--line); background:#fff; border-radius:16px;
  padding:14px 16px; font-size:15.5px; line-height:1.6; cursor:pointer;
  transition:border-color .15s ease, background .15s ease;
}
.opts.grid4{grid-template-columns:repeat(4,1fr); gap:8px;}
.opts.grid2 .opt, .opts.grid4 .opt{text-align:center; padding:13px 8px;}
.opts.grid4 .opt{padding:12px 2px; font-size:15px; letter-spacing:.02em; font-variant-numeric:tabular-nums;}
.opt.wide{grid-column:1 / -1;}
@media (hover:hover){ .opt:hover{border-color:#BFDDEB;} }
.opt.on{border-color:var(--grad-a); background:var(--sky-soft);}

/* ── 結果 ── */
.res-head{text-align:center; padding:10px 0 4px;}
.res-head .eyebrow{font-size:13px; color:var(--ink-dim); margin:0;}
.res-head .icon{width:112px; height:112px; margin:12px auto 8px; border-radius:50%; display:grid; place-items:center;}
.res-head h1{font-size:27px; line-height:1.45; font-weight:900; margin:0;}
.res-head .catch{font-size:15px; color:var(--ink-soft); margin:6px 0 0;}

.sec{margin-top:16px;}
.sec h2{font-size:16px; font-weight:900; margin:0 0 10px; display:flex; align-items:center; gap:8px;}
.sec h2::before{content:""; width:6px; height:18px; border-radius:3px; background:linear-gradient(var(--grad-a),var(--grad-b));}
.sec p{margin:0; font-size:15px;}
.mbti{margin-top:14px; background:var(--peach); border-radius:14px; padding:12px 14px;}
.mbti .lbl{font-size:13px; font-weight:900; color:var(--peach-ink); margin:0 0 2px; letter-spacing:.03em;}
.mbti p{font-size:14.5px;}
.mbti p.fine{margin-top:8px; font-size:12px; line-height:1.7; color:var(--ink-dim);}
.points{list-style:none; margin:0; padding:0; display:grid; gap:10px;}
.points li{display:flex; gap:10px; font-size:15px; line-height:1.7;}
.points li b{
  flex:none; width:24px; height:24px; border-radius:50%; background:var(--sky-soft); color:var(--grad-a);
  font-size:13px; display:grid; place-items:center; margin-top:2px;
}
.plan{
  border-radius:18px; padding:18px; background:linear-gradient(135deg,#EAF6FC,#E8F8F6);
}
.plan .lbl{font-size:12.5px; font-weight:700; color:var(--grad-a); margin:0;}
.plan .name{font-size:21px; font-weight:900; margin:2px 0 6px;}
.plan p{font-size:14.5px; color:var(--ink-soft);}
.cycle{list-style:none; margin:14px 0 0; padding:0; display:grid; gap:0; background:#fff; border-radius:14px; padding:6px 14px;}
.cycle li{display:flex; gap:10px; align-items:flex-start; padding:9px 0; font-size:14px; line-height:1.6; position:relative;}
.cycle li + li{border-top:1px dashed var(--line);}
.cycle li b{
  flex:none; width:22px; height:22px; border-radius:50%; margin-top:1px;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b)); color:#fff; font-size:12px; display:grid; place-items:center;
}
.plan p.loop{margin-top:8px; font-size:13px; font-weight:700; color:var(--grad-a); text-align:center;}
.plan .aside{margin-top:10px; font-size:13.5px; background:#fff; border-radius:12px; padding:10px 12px; color:var(--ink-soft);}

.send{margin-top:16px; text-align:center;}
.send h2{font-size:20px; font-weight:900; line-height:1.5; margin:0 0 8px;}
.send .body{font-size:14.5px; color:var(--ink-soft); margin:0 0 18px; text-align:left;}
.send .btn small{font-size:12px; font-weight:500; opacity:.9;}
.send .how{font-size:12.5px; color:var(--ink-dim); margin:10px 0 0;}
details.msg{margin-top:16px; text-align:left; font-size:13px;}
details.msg summary{cursor:pointer; color:var(--ink-soft); list-style:none; text-align:center;}
details.msg summary::-webkit-details-marker{display:none;}
details.msg summary::after{content:" ▾";}
details.msg[open] summary::after{content:" ▴";}
details.msg pre{
  white-space:pre-wrap; font-family:inherit; background:var(--bg); border-radius:12px;
  padding:12px 14px; margin:10px 0; font-size:13px; line-height:1.7; color:var(--ink-soft);
}
.pf{text-align:left; background:var(--bg); border-radius:18px; padding:16px 14px; margin:0 0 18px; display:grid; gap:16px;}
.pf-head{margin:0; font-size:13.5px; font-weight:700; color:var(--ink); text-align:center;}
.pf-lbl{margin:0 0 8px; font-size:13.5px; font-weight:700; color:var(--ink);}
.pf-lbl small{font-size:12px; font-weight:500; color:var(--ink-dim); margin-left:8px;}
.pf-chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); border-radius:999px;
  padding:7px 13px; font-size:13.5px; line-height:1.5; cursor:pointer; text-align:left;
  transition:border-color .15s ease, background .15s ease, color .15s ease;
}
.chip[aria-pressed="true"]{border-color:var(--grad-a); background:var(--sky-soft); color:var(--grad-a); font-weight:700;}
.chip:focus-visible, .opt:focus-visible, .btn:focus-visible{outline:3px solid var(--sky); outline-offset:2px;}
.pf-note{margin:-6px 0 0; font-size:12px; color:var(--ink-dim); text-align:center;}
.copy{
  width:100%; border:1.5px solid var(--line); background:#fff; border-radius:999px;
  padding:11px; font-size:14px; cursor:pointer; color:var(--ink-soft);
}
.copy.done{border-color:var(--line-g); color:var(--line-g2);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><img src="/assets/img/wagon-logo.png" alt="ナース・ライセンススクール WAGON"></header>

  <!-- ===== はじめ ===== -->
  <section class="screen intro" id="s-intro">
    <div class="card">
      <div class="blob" aria-hidden="true">
        <svg width="76" height="76" viewBox="0 0 76 76" fill="none">
          <rect x="14" y="12" width="40" height="52" rx="8" fill="#fff" stroke="#1878C4" stroke-width="3"/>
          <path d="M23 26h22M23 35h22M23 44h13" stroke="#4EC6EC" stroke-width="3" stroke-linecap="round"/>
          <circle cx="52" cy="50" r="12" fill="#17C7C2"/>
          <path d="M46.5 50.5l4 4 7-8" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="chips"><span>約1分</span><span>登録なし</span><span>無料</span></div>

  <section class="screen" id="s-quiz" hidden>
    <div class="qtop">
      <button class="back" id="back" type="button" aria-label="前の質問に戻る">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 3.5L5.5 9l5.5 5.5" stroke="#4F6478" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="bar"><i id="bar"></i></div>
      <div class="count" id="count"></div>
    </div>
    <div class="card q" id="q"></div>
  </section>

  <!-- ===== 結果 ===== -->
  <section class="screen" id="s-result" hidden></section>
</div>

<script>
/* ============================================================
   設定
   ============================================================ */
var CONFIG = {
  // 公式LINEのベーシックID（page.line.me/wvr6857m で確認済み）
  lineId: '@wvr6857m',
  // 送る文面の先頭につける見出し。担任がトーク一覧で見分けるための目印
  msgTitle: '【勉強のしかた診断】'
};

/* 公式LINEのトーク画面を、文面を入れた状態で開くリンク。
   IDの「@」はエンコードしない（%40にすると公式アカウントに遷移しない）。
   公式アカウントのページ page.line.me/wvr6857m 自身が使っている形
   https://line.me/R/oaMessage/@wvr6857m/?本文 に合わせている */
function lineHref(text){
  return 'https://line.me/R/oaMessage/' + CONFIG.lineId + '/?' + encodeURIComponent(text);
}

/* ============================================================
   質問
   x … 誰が選ぶか。＋なら何を見て次に何をするかを決めてほしい（サブスクWAGON）、
       −なら自分で選べる（対面講義）
   y … 学び方。＋なら自分のペースで毎日、−なら講師の前で・まとめて
   short … LINEに送る文面での表記
   ============================================================ */
var QUESTIONS = [
  // MBTIは判定（x/y）には使わない。結果画面の一言と、担任との会話のきっかけにだけ使う
  { id:'mbti', q:'あなたのMBTIは？', sub:'わからなければ「わからない」でだいじょうぶです', grid:4,
    opts:['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP',
          'ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP']
      .map(function(m){ return { t:m, mbti:m }; })
      .concat([{ t:'わからない', short:'わからない', wide:true }])
  },
  { id:'start', q:'いまの勉強の進め方に、いちばん近いのは？',
    opts:[
      { t:'何から手をつければいいか、決められない',     short:'何からやるか決められない', x:2 },
      { t:'計画は立てるけれど、続かない',               short:'計画が続かない',   x:1 },
      { t:'やることは決まっているけれど、時間が足りない', short:'時間が足りない',   x:-1 },
      { t:'自分でやることを決めて、進められている',     short:'自分で決めて進められている', x:-2 }
    ]},
  { id:'range', q:'不安な分野は、どのくらいありますか？',
    opts:[
      { t:'ほとんど全部が不安',                 short:'ほとんど全部', x:2 },
      { t:'解剖生理など、土台からあやふや',     short:'土台からあやふや', x:1 },
      { t:'まだ、よくわからない',               short:'まだわからない' },
      { t:'苦手な分野が2〜3個、はっきりしている', short:'苦手が2〜3個に絞れている', x:-2 }
    ]},
  { id:'review', q:'問題を1つ解いたあと、ほかの知識とつなげて考えていますか？', sub:'たとえば心不全の問題なら、心臓のしくみや、似た症状の病気まで考えるか',
    opts:[
      { t:'答えを覚えて、そこで終わることが多い',                         short:'答えを覚えて終わる', x:2 },
      { t:'つなげたほうがいいと思うけれど、どうつなげればいいかわからない', short:'つなげ方がわからない', x:1 },
      { t:'ときどき、関係するところまでさかのぼって確かめている',         short:'ときどきつなげている', x:-1 },
      { t:'いつも、しくみや関係する病気まで広げて考えている',             short:'いつもつなげている', x:-2 }
    ]},
  { id:'ask', q:'わからないところがあったら、どうしたいですか？',
    opts:[
      { t:'説明を、納得するまで何度も見返したい', short:'何度も見返したい', y:2 },
      { t:'自分で調べて、あとで確かめられれば十分', short:'自分で調べたい', y:1 },
      { t:'友だちと話しながら考えたい',           short:'人と話しながら考えたい', y:-1 },
      { t:'講師に直接聞いて、その場で解決したい', short:'講師に直接聞きたい', y:-2 }
    ]},
  { id:'focus', q:'勉強がはかどるのは、どんなときですか？',
    opts:[
      { t:'家で、自分のペースで進めるとき',       short:'家で自分のペース', y:2 },
      { t:'通学中などの、すきま時間',             short:'すきま時間', y:1 },
      { t:'予定や締め切りが決まっているとき',     short:'予定が決まっているとき', y:-1 },
      { t:'人がいる場所で、ほどよく緊張感があるとき', short:'人がいる場所', y:-2 }
    ]},
  { id:'time', q:'勉強の時間は、どう取りやすいですか？',
    opts:[
      { t:'平日に、毎日少しずつ',               short:'毎日少しずつ', y:2 },
      { t:'実習や仕事で、ほとんど取れていない', short:'ほとんど取れていない', y:1, x:1 },
      { t:'日によってばらばら',                 short:'日によってばらばら', y:-1 },
      { t:'休みの日に、まとめて',               short:'休みの日にまとめて', y:-2 }
    ]},
  { id:'venue', q:'通いやすい場所はありますか？', sub:'WAGONの対面講義を開いている会場です', grid:2,
    opts:[
      { t:'埼玉' }, { t:'東京' }, { t:'神奈川' },
      { t:'名古屋' }, { t:'大阪' }, { t:'福岡' },
      { t:'どこも遠い', short:'どこも遠い', far:true, wide:true }
    ]},
  { id:'member', q:'いま、WAGONで使っているものはありますか？',
    opts:[
      { t:'LINEの毎日問題などの、無料のもの',     short:'無料のもの' },
      { t:'対面講義・LIVE教室に参加したことがある', short:'対面講義・LIVE教室の参加経験あり' },
      { t:'オンラインサロン',                     short:'オンラインサロン' },
      { t:'サブスクWAGON（受講中）',              short:'サブスクWAGON受講中', subsc:true }
    ]}
];

/* 同点のときは、この質問の向きで決める（いちばん直接その軸を聞いている質問） */
var TIEBREAK = { x:'range', y:'ask' };

/* ============================================================
   タイプ
   値段は出さない。低学年に月額を先に見せない方針のため、
   料金の話は担任がLINEで学年を見てから行う。
   ============================================================ */
var TYPES = {
  // 全体を任せたい × 自分のペースで毎日
  steady: {
    name:'コツコツ|伴走タイプ',
    catch:'道筋さえ見えれば、ちゃんと続けられる人',
    color:['#DDF2FB','#1878C4'],
    body:'何から手をつけるかが決まれば、毎日こつこつ進められるタイプです。いま足りないのは、やる気ではなく「今日はこれをやる」が決まっている状態です。',
    points:[
      '見るところを自分で探すより、決めてもらったところから始める',
      '1日の量は少なくていいので、毎日同じ時間に続ける',
      'わからないところは、その日のうちに聞いて解消する'
    ],
    plan:'subsc',
    planText:'「今日はここを見る」が、いつも担任から届きます。何から手をつけるか迷う時間が、なくなります。'
  },
  // 全体を任せたい × 講師の前で
  rebuild: {
    name:'土台から|組み直しタイプ',
    catch:'一度つながれば、一気に伸びる人',
    color:['#E3F6F1','#0F9E8A'],
    body:'不安な分野が広いのは、分野ごとにばらばらに覚えているからかもしれません。解剖生理の土台からつなぎ直すと、疾患の理解がまとめて進みます。人から説明を聞くと入りやすいあなたには、すぐ質問できる環境が大切です。',
    points:[
      '過去問を解く前に、解剖生理から順番に理解する',
      '覚えるより先に「なぜそうなるか」を説明してもらう',
      'わからないまま、次の分野に進まない'
    ],
    plan:'subsc',
    planText:'わからないところの原因が手前の単元にあれば、担任がそこまでさかのぼって、見るところを示します。解剖生理の土台から、順番につなぎ直せます。'
  },
  // 必要なところだけ × 自分のペースで毎日
  target: {
    name:'ねらい撃ち|タイプ',
    catch:'やるべき場所が、もう見えている人',
    color:['#FFF1E6','#C8702E'],
    body:'自分で進める力があって、苦手もはっきりしています。全部をやり直す必要はありません。弱いところにだけ、濃い時間を使うのがいちばんの近道です。',
    points:[
      'ふだんの勉強は、いまのやり方をそのまま続ける',
      '苦手な分野を1つずつ選んで、集中して固める',
      '固めた分野が取れているか、模試や過去問で確かめる'
    ],
    plan:'venue',
    planText:'1回ごとに申し込めるので、苦手な分野に合わせて必要な回だけを受けられます。'
  },
  // 必要なところだけ × 講師の前で
  live: {
    name:'その場で聞いて|スッキリタイプ',
    catch:'人から聞くと、すっと頭に入る人',
    color:['#FDEFF4','#C94C74'],
    body:'ひとりで読むより、講師の説明を聞いて、その場で質問したほうが頭に残るタイプです。まとまった時間に集中したほうが、力を出しやすいはずです。',
    points:[
      '苦手な分野は、講師に直接聞いて一度で理解する',
      '休みの日などのまとまった時間を、勉強の山場にする',
      '聞いた内容は、その週のうちに問題で使ってみる'
    ],
    plan:'venue',
    planText:'少人数の講義なので、講師に直接質問しながら学べます。1回ごとに申し込めるので、必要な回だけを受けられます。'
  }
};

/* MBTIの E/I と J/P の組み合わせで、結果画面に添える一言。
   判定は変えず、「勉強のしかた」への付け足しとして出す。
   MBTIから学び方を言い当てる根拠はないので、言い切らない（「〜かもしれません」）。
   お楽しみ・会話のきっかけという位置づけを崩さないこと */
var MBTI_TIPS = {
  EJ:'人と一緒に予定を決めると、進めやすいかもしれません。いっしょに勉強する日を先に決めてみるのも、ひとつの手です。',
  EP:'人と話しながら覚えるほうが、頭に残りやすいかもしれません。予定は細かく決めすぎないほうが続く、という人もいます。',
  IJ:'ひとりで振り返る時間があると、理解が深まりやすいかもしれません。その時間を先に予定に入れてみるのも、ひとつの手です。',
  IP:'ひとりで振り返る時間があると、理解が深まりやすいかもしれません。やる順番は気分で選んでも、その週の範囲だけ決めておくと安心です。'
};

var PLANS = {
  // サブスクWAGONは「動画が見放題」ではなく、「何を見て、見たあと何をするかを担任が決める」サービス。
  // 対面講義との違いは範囲の広さではなく、誰が選んで、そのあと誰が見届けるか
  subsc: { name:'サブスクWAGON', lbl:'見るところを、担任が決めてくれる',
    steps:[
      'わからないところを、LINEで担任に送る',
      '担任から「この動画の、ここを見てください」と届く',
      '見終わったら、その場面の確認問題が届く',
      '解けたら、次に見るところへ進む'
    ]},
  venue: { name:'対面講義',       lbl:'受ける回を、自分で選ぶ' }
};

var ICONS = {
  steady:'<path d="M14 50c8 0 10-10 18-10s10 10 18 10 8-6 10-8" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="14" cy="50" r="5" fill="currentColor"/><circle cx="58" cy="40" r="5" fill="currentColor"/><path d="M52 20l6 6-6 6" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
  rebuild:'<rect x="12" y="44" width="48" height="10" rx="4" fill="currentColor"/><rect x="18" y="31" width="36" height="10" rx="4" fill="currentColor" opacity=".7"/><rect x="24" y="18" width="24" height="10" rx="4" fill="currentColor" opacity=".45"/>',
  target:'<circle cx="36" cy="36" r="22" stroke="currentColor" stroke-width="4" fill="none"/><circle cx="36" cy="36" r="12" stroke="currentColor" stroke-width="4" fill="none" opacity=".6"/><circle cx="36" cy="36" r="4" fill="currentColor"/>',
  live:'<path d="M14 18h32a6 6 0 016 6v14a6 6 0 01-6 6H30l-10 8v-8h-6a6 6 0 01-6-6V24a6 6 0 016-6z" fill="currentColor" opacity=".85"/><circle cx="23" cy="31" r="2.6" fill="#fff"/><circle cx="31" cy="31" r="2.6" fill="#fff"/><circle cx="39" cy="31" r="2.6" fill="#fff"/><path d="M58 30v18" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="58" cy="55" r="3" fill="currentColor"/>'
};

/* ============================================================
   計測
   ============================================================ */
var SRC = (location.search.match(/[?&]src=([^&]+)/) || [])[1] || 'direct';
function track(name, params){
  params = params || {};
  params.diag_src = SRC;
  try { gtag('event', name, params); } catch(e){}
}

/* ============================================================
   画面
   ============================================================ */
var $ = function(id){ return document.getElementById(id); };
var answers = [];   // 質問ごとの選択肢の番号
var qi = 0;

function show(id){
  ['s-intro','s-quiz','s-result'].forEach(function(s){ $(s).hidden = (s !== id); });
  window.scrollTo(0, 0);
}

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; });
}

$('start').addEventListener('click', function(){
  answers = []; qi = 0;
  track('diag_start');
  show('s-quiz');
  renderQ();
});

$('back').addEventListener('click', function(){
  if (qi > 0){ qi--; renderQ(); }
});

function renderQ(){
  var q = QUESTIONS[qi];
  $('bar').style.width = (qi / QUESTIONS.length * 100) + '%';
  $('count').textContent = (qi + 1) + '/' + QUESTIONS.length;
  $('back').disabled = (qi === 0);

  var el = $('q');
  el.innerHTML =
    '<p class="num">Q' + (qi + 1) + '</p>' +
    '<h2>' + esc(q.q) + '</h2>' +
    (q.sub ? '<p class="sub">' + esc(q.sub) + '</p>' : '') +
    '<div class="opts' + (q.grid ? ' grid' + q.grid : '') + '">' +
      q.opts.map(function(o, i){
        return '<button type="button" class="opt' + (o.wide ? ' wide' : '') +
               (answers[qi] === i ? ' on' : '') + '" data-i="' + i + '">' + esc(o.t) + '</button>';
      }).join('') +
    '</div>';
  el.classList.remove('screen'); void el.offsetWidth; el.classList.add('screen');
}

var busy = false;
$('q').addEventListener('click', function(e){
  var b = e.target.closest('.opt');
  if (!b || busy) return;
  busy = true;
  answers[qi] = +b.getAttribute('data-i');
  Array.prototype.forEach.call(this.querySelectorAll('.opt'), function(x){ x.classList.remove('on'); });
  b.classList.add('on');
  setTimeout(function(){
    busy = false;
    if (qi < QUESTIONS.length - 1){ qi++; renderQ(); }
    else { showResult(); }
  }, 220);
});

/* ============================================================
   判定
   ============================================================ */
function picked(id){
  var i = QUESTIONS.findIndex(function(q){ return q.id === id; });
  return QUESTIONS[i].opts[answers[i]];
}

function judge(){
  var x = 0, y = 0;
  QUESTIONS.forEach(function(q, i){
    var o = q.opts[answers[i]];
    x += o.x || 0; y += o.y || 0;
  });
  if (x === 0) x = picked(TIEBREAK.x).x || 1;
  if (y === 0) y = picked(TIEBREAK.y).y || 1;
  var key = x > 0 ? (y > 0 ? 'steady' : 'rebuild') : (y > 0 ? 'target' : 'live');
  return { key:key, x:x, y:y };
}

/* ============================================================
   担任に送る前に、タップで選んでもらう項目（すべて任意）
   文字入力はさせない。選ばなかった項目は送る文面に出さない
   multi … 複数選べる
   when  … ほかの項目がこの値のときだけ出す
   ============================================================ */
var PROFILE = [
  { id:'grade', label:'学年',
    opts:['1年生','2年生','3年生（専門学校・短大）','3年生（大学）','4年生','既卒'] },
  { id:'worry', label:'困っていること', multi:true, sub:'いくつでも選べます',
    opts:['何から始めればいいか分からない','覚えてもすぐ忘れる','問題になると解けない',
          '模試の点数が伸びない','苦手な分野がある','勉強の時間が取れない','実習や課題で手いっぱい'] },
  // 模試は「WAGONの模試」と「WAGON以外の模試」を分けて聞く。受けた方だけ、直近の点数を選ぶ。
  // 必修は50点満点で合格基準は8割（40点）。一般・状況設定は250点満点で、合格ラインは年によって6割前後
  { id:'wagonMock', label:'WAGONの模試',
    opts:['受けたことがある','受けたことがない'] },
  { id:'wagonHisshu', label:'WAGONの模試の点数（必修）', when:{ wagonMock:'受けたことがある' },
    opts:['34点以下','35〜39点','40〜44点','45点以上','覚えていない'] },
  { id:'wagonIppan', label:'WAGONの模試の点数（一般・状況設定）', when:{ wagonMock:'受けたことがある' },
    opts:['129点以下','130〜149点','150〜169点','170点以上','覚えていない'] },
  { id:'otherMock', label:'WAGON以外の模試',
    opts:['受けたことがある','受けたことがない'] },
  { id:'otherHisshu', label:'WAGON以外の模試の点数（必修）', when:{ otherMock:'受けたことがある' },
    opts:['34点以下','35〜39点','40〜44点','45点以上','覚えていない'] },
  { id:'otherIppan', label:'WAGON以外の模試の点数（一般・状況設定）', when:{ otherMock:'受けたことがある' },
    opts:['129点以下','130〜149点','150〜169点','170点以上','覚えていない'] }
];
var profile = {};   // { grade:'3年生（大学）', worry:['…','…'], … }

function profileVisible(f){
  if (!f.when) return true;
  return Object.keys(f.when).every(function(k){ return profile[k] === f.when[k]; });
}

function profileLines(){
  var v = function(id){
    var f = PROFILE.filter(function(p){ return p.id === id; })[0];
    var x = profile[id];
    if (!profileVisible(f) || x == null || (x.join && !x.length)) return '';
    return x.join ? x.join('、') : x;
  };
  var lines = [];
  if (v('grade'))  lines.push('学年：' + v('grade'));
  if (v('worry'))  lines.push('困っていること：' + v('worry'));
  // 「WAGONの模試：必修 35〜39点／一般・状況設定 150〜169点」の形。点数を選ばなければ受験の有無だけ
  [['wagon', 'WAGONの模試'], ['other', 'WAGON以外の模試']].forEach(function(m){
    var took = v(m[0] + 'Mock');
    if (!took) return;
    var scores = [
      v(m[0] + 'Hisshu') ? '必修 ' + v(m[0] + 'Hisshu') : '',
      v(m[0] + 'Ippan')  ? '一般・状況設定 ' + v(m[0] + 'Ippan') : ''
    ].filter(Boolean).join('／');
    lines.push(m[1] + '：' + (scores || took));
  });
  return lines;
}

function buildMessage(t){
  var lines = [
    CONFIG.msgTitle,
    'タイプ：' + t.name.replace('|', ''),
    '合う学び方：' + PLANS[t.plan].name,
    ''
  ];
  var pl = profileLines();
  if (pl.length) lines = lines.concat(pl, ['']);
  QUESTIONS.forEach(function(q, i){
    var o = q.opts[answers[i]];
    var label = {
      mbti:'MBTI', start:'勉強の進め方', range:'不安な分野', review:'ほかの知識とのつながり',
      ask:'わからないとき', focus:'はかどるとき', time:'勉強の時間', venue:'通いやすい会場', member:'WAGONの利用'
    }[q.id];
    lines.push(label + '：' + (o.short || o.t));
  });
  lines.push('', 'この結果に合う進め方を教えてください。');
  return lines.join('\n');
}

function showResult(){
  $('bar').style.width = '100%';
  var r = judge();
  var t = TYPES[r.key];
  var plan = PLANS[t.plan];
  var far = !!picked('venue').far;
  var member = !!picked('member').subsc;
  var mbti = picked('mbti').mbti || '';
  var mbtiTip = mbti ? MBTI_TIPS[mbti.charAt(0) + mbti.charAt(3)] : '';
  profile = {};
  var msg = buildMessage(t);
  var lineUrl = lineHref(msg);

  track('diag_complete', {
    diag_type: r.key, diag_plan: t.plan, mbti: mbti || 'unknown',
    venue_far: far ? 'yes' : 'no', member: picked('member').short
  });

  // 対面講義が合うのに会場が遠い人／すでにサブスク受講中の人には、ひとこと添える
  var aside = '';
  if (t.plan === 'venue' && far){
    aside = '近くに会場がない場合の進め方も、担任からご案内します。';
  } else if (member){
    aside = 'いま受講中の講座のなかで、このタイプに合う進め方を担任からお伝えします。';
  }

  $('s-result').innerHTML =
    '<div class="card">' +
      '<div class="res-head">' +
        '<p class="eyebrow">あなたは</p>' +
        '<div class="icon" style="background:' + t.color[0] + '; color:' + t.color[1] + '">' +
          '<svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">' + ICONS[r.key] + '</svg></div>' +
        '<h1>' + t.name.split('|').map(function(s){ return '<span class="nb">' + esc(s) + '</span>'; }).join('') + '</h1>' +
        '<p class="catch">' + esc(t.catch) + '</p>' +
      '</div>' +
    '</div>' +

    '<div class="card sec">' +
      '<h2>あなたの勉強のしかた</h2>' +
      '<p>' + esc(t.body) + '</p>' +
      (mbtiTip
        ? '<div class="mbti"><p class="lbl">' + mbti + 'のあなたへ</p><p>' + esc(mbtiTip) + '</p>' +
            '<p class="fine">MBTIは参考程度に。あなたに合うやり方は、担任といっしょに確かめていきましょう。</p></div>'
        : '') +
    '</div>' +

    '<div class="card sec">' +
      '<h2>合う進め方</h2>' +
      '<ul class="points">' +
        t.points.map(function(p, i){ return '<li><b>' + (i + 1) + '</b><span>' + esc(p) + '</span></li>'; }).join('') +
      '</ul>' +
    '</div>' +

    '<div class="card sec">' +
      '<h2>WAGONなら、この形</h2>' +
      '<div class="plan">' +
        '<p class="lbl">' + esc(plan.lbl) + '</p>' +
        '<p class="name">' + esc(plan.name) + '</p>' +
        '<p>' + esc(t.planText) + '</p>' +
        (plan.steps
          ? '<ol class="cycle">' +
              plan.steps.map(function(s, i){ return '<li><b>' + (i + 1) + '</b><span>' + esc(s) + '</span></li>'; }).join('') +
            '</ol>' +
            '<p class="loop">わからないことがなくなるまで、これをくり返します。</p>'
          : '') +
        (aside ? '<p class="aside">' + esc(aside) + '</p>' : '') +
      '</div>' +
    '</div>' +

    '<div class="card send">' +
      '<h2>この結果を、<br>担任に送ってみませんか</h2>' +
      '<p class="body">担任があなたの結果を読んで、<b>いまの状況に合わせた具体的な進め方</b>をLINEでお返事します。</p>' +
      '<div class="pf">' +
        '<p class="pf-head">あてはまるものをタップすると、いっしょに送れます</p>' +
        PROFILE.map(function(f){
          return '<div class="pf-row" data-f="' + f.id + '"' + (profileVisible(f) ? '' : ' hidden') + '>' +
                   '<p class="pf-lbl">' + esc(f.label) + (f.sub ? '<small>' + esc(f.sub) + '</small>' : '') + '</p>' +
                   '<div class="pf-chips">' +
                     f.opts.map(function(o){
                       return '<button type="button" class="chip" aria-pressed="false" data-v="' + esc(o) + '">' + esc(o) + '</button>';
                     }).join('') +
                   '</div>' +
                 '</div>';
        }).join('') +
        '<p class="pf-note">選ばなくても送れます</p>' +
      '</div>' +
      '<a class="btn line" id="send" href="' + lineUrl + '">LINEで担任に送る</a>' +
      '<p class="how">LINEが開いたら、そのまま送信してください</p>' +
      '<details class="msg">' +
        '<summary>送られる内容を見る・うまく開かないとき</summary>' +
        '<pre id="msg">' + esc(msg) + '</pre>' +
        '<button type="button" class="copy" id="copy">内容をコピーする</button>' +
        '<p class="note">コピーしたら、WAGONのLINEのトークに貼りつけて送ってください。</p>' +
      '</details>' +
    '</div>' +

    '<button type="button" class="btn ghost" id="retry">もう一度診断する</button>';

  show('s-result');

  // 選ぶたびに、送る文面とLINEのリンクを作り直す
  function refresh(){
    msg = buildMessage(t);
    $('send').href = lineHref(msg);
    $('msg').textContent = msg;
    Array.prototype.forEach.call(document.querySelectorAll('.pf-row'), function(row){
      var f = PROFILE.filter(function(p){ return p.id === row.getAttribute('data-f'); })[0];
      row.hidden = !profileVisible(f);
    });
  }

  document.querySelector('.pf').addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if (!chip) return;
    var row = chip.closest('.pf-row');
    var f = PROFILE.filter(function(p){ return p.id === row.getAttribute('data-f'); })[0];
    var val = chip.getAttribute('data-v');
    var on = chip.getAttribute('aria-pressed') !== 'true';

    if (f.multi){
      var list = (profile[f.id] || []).filter(function(x){ return x !== val; });
      if (on) list.push(val);
      // 選択肢の並び順で送る
      profile[f.id] = f.opts.filter(function(o){ return list.indexOf(o) !== -1; });
      chip.setAttribute('aria-pressed', on ? 'true' : 'false');
    } else {
      // もう一度押すと選択を外せる
      profile[f.id] = on ? val : null;
      Array.prototype.forEach.call(row.querySelectorAll('.chip'), function(c){
        c.setAttribute('aria-pressed', (on && c === chip) ? 'true' : 'false');
      });
    }
    refresh();
  });

  function profileParams(){
    return {
      grade: profile.grade || 'none',
      wagon_mock: profile.wagonMock || 'none',
      other_mock: profile.otherMock || 'none',
      worry_count: (profile.worry || []).length
    };
  }

  $('send').addEventListener('click', function(){
    var p = profileParams();
    p.method = 'line'; p.diag_type = r.key; p.diag_plan = t.plan;
    track('diag_send', p);
  });
  $('copy').addEventListener('click', function(){
    var btn = this;
    var done = function(){
      btn.textContent = 'コピーしました';
      btn.classList.add('done');
      track('diag_send', { method:'copy', diag_type:r.key, diag_plan:t.plan });
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(msg).then(done, fallback);
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = msg; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(e){}
      document.body.removeChild(ta);
    }
  });
  $('retry').addEventListener('click', function(){ show('s-intro'); });
}
</script>
</body>
</html>
