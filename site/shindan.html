<style>
:root{
  --bg:#F3F8FA; --card:#FFFFFF; --ink:#1B3A56; --ink-soft:#4F6478; --ink-dim:#8597A8;
  --line:#E3ECF1; --grad-a:#1878C4; --grad-b:#17C7C2; --sky:#4EC6EC; --sky-soft:#EAF7FC;
  --peach:#FFF1E6; --peach-ink:#C8702E; --marker:#FFF3A3;
  --ok:#0FA37F; --ok-soft:#E4F7F1; --ng:#D9534F; --ng-soft:#FDECEC;
  --line-g:#06C755; --line-g2:#05B04B;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  font-weight:500; line-height:1.8; -webkit-font-smoothing:antialiased;
  line-break:strict; overflow-wrap:break-word;
  min-height:100svh;
}
button{font:inherit; color:inherit;}
.wrap{max-width:480px; margin:0 auto; padding:0 16px calc(32px + env(safe-area-inset-bottom));}
.nb{display:inline-block;}  /* 文節を途中で折り返さない */
[hidden]{display:none !important;}

.top{padding:14px 0 6px; display:flex; justify-content:center;}
.top img{height:22px; width:auto;}

.card{
  background:var(--card); border-radius:24px; padding:24px 20px;
  box-shadow:0 1px 0 var(--line), 0 10px 30px rgba(27,58,86,.06);
}
.card + .card, .card + .btn{margin-top:16px;}
.screen{animation:fade .35s ease both;}
@keyframes fade{from{opacity:.3; transform:translateY(6px);}to{opacity:1; transform:none;}}
@media (prefers-reduced-motion:reduce){ .screen, .pop{animation:none !important;} .bar i{transition:none;} }

/* ── はじめの画面 ── */
.intro{text-align:center; padding-top:14px;}
.intro .eyebrow{font-size:13px; color:var(--grad-a); font-weight:700; letter-spacing:.06em; margin:0;}
.intro h1{font-size:25px; line-height:1.5; font-weight:900; margin:6px 0 10px;}
.intro h1 .hl{background:linear-gradient(transparent 62%, var(--marker) 62%);}
.intro .lead{font-size:14.5px; color:var(--ink-soft); margin:0 0 18px;}
.lineup{display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin:4px 0 16px;}
.lineup svg{width:100%; height:auto; display:block;}
.chips{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:22px;}
.chips span{font-size:12.5px; background:var(--sky-soft); color:var(--grad-a); border-radius:999px; padding:4px 12px; font-weight:700;}

.btn{
  display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  border:0; border-radius:999px; padding:17px 20px; font-size:17px; font-weight:700;
  cursor:pointer; text-decoration:none; transition:transform .12s ease;
}
.btn:active{transform:scale(.98);}
.btn.main{background:linear-gradient(90deg,var(--grad-a),var(--grad-b)); color:#fff; box-shadow:0 8px 20px rgba(24,120,196,.25);}
.btn.line{background:var(--line-g); color:#fff; box-shadow:0 8px 20px rgba(6,199,85,.25);}
.btn.line:active{background:var(--line-g2);}
.btn.ghost{background:transparent; color:var(--ink-soft); font-size:14px; padding:12px; font-weight:500;}
.note{font-size:12.5px; color:var(--ink-dim); margin:12px 0 0; text-align:center;}
.btn:focus-visible, .opt:focus-visible, .chip:focus-visible, .choice:focus-visible{outline:3px solid var(--sky); outline-offset:2px;}

/* ── 質問 ── */
.qtop{display:flex; align-items:center; gap:12px; padding:8px 0 16px;}
.back{
  flex:none; width:36px; height:36px; border-radius:50%; border:0; background:#fff;
  box-shadow:0 1px 0 var(--line); display:grid; place-items:center; cursor:pointer;
}
.back:disabled{visibility:hidden;}
.bar{flex:1; height:8px; background:#E1EAEF; border-radius:999px; overflow:hidden;}
.bar i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--grad-a),var(--grad-b)); border-radius:999px; transition:width .35s ease;}
.count{flex:none; font-size:13px; color:var(--ink-dim); font-variant-numeric:tabular-nums; min-width:36px; text-align:right;}

.q .num{font-size:13px; font-weight:700; color:var(--grad-a); margin:0 0 4px;}
.q h2{font-size:21px; line-height:1.55; font-weight:900; margin:0 0 6px;}
.q .sub{font-size:13px; color:var(--ink-dim); margin:0 0 4px;}
.opts{display:grid; gap:10px; margin-top:18px;}
.opt{
  text-align:left; border:2px solid var(--line); background:#fff; border-radius:16px;
  padding:14px 16px; font-size:15.5px; line-height:1.6; cursor:pointer;
  transition:border-color .15s ease, background .15s ease;
}
.opts.grid4{grid-template-columns:repeat(4,1fr); gap:8px;}
.opts.grid4 .opt{text-align:center; padding:12px 2px; font-size:15px; letter-spacing:.02em;}
.opts.grid2{grid-template-columns:1fr 1fr; gap:8px;}
.opts.grid2 .opt{text-align:center; padding:13px 4px;}
.opt.wide{grid-column:1 / -1;}
@media (hover:hover){ .opt:hover{border-color:#BFDDEB;} }
.opt.on{border-color:var(--grad-a); background:var(--sky-soft);}

/* ── 結果：今日の敵 ── */
.enemy{text-align:center; padding-top:20px;}
.enemy .eyebrow{font-size:13px; color:var(--ink-dim); margin:0;}
.enemy .art{width:170px; height:170px; margin:10px auto 6px; border-radius:50%; display:grid; place-items:center;}
.enemy .art svg{width:140px; height:140px;}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes pop{from{transform:scale(.6); opacity:.2;}to{transform:none; opacity:1;}}
.enemy h1{font-size:27px; line-height:1.4; font-weight:900; margin:0;}
/* 敵のセリフ（吹き出し） */
.say{
  position:relative; margin:14px auto 0; max-width:320px; background:#fff; border:2px solid var(--ink);
  border-radius:18px; padding:10px 16px; font-size:16px; font-weight:700; line-height:1.6;
}
.say::before{content:""; position:absolute; left:50%; top:-9px; width:14px; height:14px; margin-left:-7px; background:#fff; border-left:2px solid var(--ink); border-top:2px solid var(--ink); transform:rotate(45deg);}
.enemy .say{box-shadow:0 3px 0 var(--ink);}
.enemy .art{position:relative;}
.enemy .scene{
  margin:14px 0 0; background:var(--bg); border-radius:14px; padding:12px 14px;
  font-size:14.5px; color:var(--ink-soft); text-align:left;
}
.enemy .scene b{display:block; font-size:12px; color:var(--ink-dim); margin-bottom:2px;}
.mbti{margin-top:12px; background:var(--peach); border-radius:14px; padding:12px 14px; text-align:left;}
.mbti .lbl{font-size:13px; font-weight:900; color:var(--peach-ink); margin:0 0 2px; letter-spacing:.03em;}
.mbti p{margin:0; font-size:14.5px;}
.mbti p.fine{margin-top:6px; font-size:12px; line-height:1.7; color:var(--ink-dim);}

.sec h2{font-size:16px; font-weight:900; margin:0 0 10px; display:flex; align-items:center; gap:8px;}
.sec h2::before{content:""; width:6px; height:18px; border-radius:3px; background:linear-gradient(var(--grad-a),var(--grad-b));}
.sec p{margin:0; font-size:15px;}
.plan-main{font-size:19px !important; font-weight:900; line-height:1.6; margin:0 0 8px !important;}
.plan-main .hl{background:linear-gradient(transparent 62%, var(--marker) 62%);}
.weak{margin-top:12px !important; font-size:14px !important; color:var(--ink-soft); border-top:1px dashed var(--line); padding-top:12px;}
.weak b{color:var(--ink);}


/* ── LINEで送る ── */
.send{text-align:center;}
.send h2{font-size:20px; font-weight:900; line-height:1.5; margin:0 0 8px;}
.send .body{font-size:14.5px; color:var(--ink-soft); margin:0 0 14px; text-align:left;}
.subsc{font-size:13.5px; color:var(--ink-soft); text-align:left; background:var(--sky-soft); border-radius:14px; padding:12px 14px; margin:0 0 16px;}
.subsc b{color:var(--grad-a);}
.send .how{font-size:12.5px; color:var(--ink-dim); margin:10px 0 0;}
.pf{text-align:left; background:var(--bg); border-radius:18px; padding:16px 14px; margin:0 0 18px; display:grid; gap:16px;}
.pf-head{margin:0; font-size:13.5px; font-weight:700; color:var(--ink); text-align:center;}
.pf-lbl{margin:0 0 8px; font-size:13.5px; font-weight:700; color:var(--ink);}
.pf-chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  border:1.5px solid var(--line); background:#fff; color:var(--ink-soft); border-radius:999px;
  padding:7px 13px; font-size:13.5px; line-height:1.5; cursor:pointer; text-align:left;
}
.chip[aria-pressed="true"]{border-color:var(--grad-a); background:var(--sky-soft); color:var(--grad-a); font-weight:700;}
.pf-note{margin:-6px 0 0; font-size:12px; color:var(--ink-dim); text-align:center;}
details.msg{margin-top:16px; text-align:left; font-size:13px;}
details.msg summary{cursor:pointer; color:var(--ink-soft); list-style:none; text-align:center;}
details.msg summary::-webkit-details-marker{display:none;}
details.msg summary::after{content:" ▾";}
details.msg[open] summary::after{content:" ▴";}
details.msg pre{
  white-space:pre-wrap; font-family:inherit; background:var(--bg); border-radius:12px;
  padding:12px 14px; margin:10px 0; font-size:13px; line-height:1.7; color:var(--ink-soft);
}
.copy{
  width:100%; border:1.5px solid var(--line); background:#fff; border-radius:999px;
  padding:11px; font-size:14px; cursor:pointer; color:var(--ink-soft);
}
.copy.done{border-color:var(--line-g); color:var(--line-g2);}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><img src="/assets/img/wagon-logo.png" alt="ナース・ライセンススクール WAGON"></header>

  <!-- ===== はじめ ===== -->
  <section class="screen intro" id="s-intro">
    <div class="card">
      <p class="eyebrow">MBTI × 今日の勉強</p>
      <h1>今日のあなたの勉強を<br><span class="hl">ジャマする敵</span>は？</h1>
      <div class="lineup" id="lineup" aria-hidden="true"></div>
      <p class="lead">6つの質問で今日の敵を見つけて、<br><span class="nb">5分の作戦で</span><span class="nb">倒しましょう。</span></p>
      <div class="chips"><span>約1分</span><span>登録なし</span><span>毎日かわる</span></div>
      <button class="btn main" id="start" type="button">敵をさがす</button>
    </div>
  </section>

  <!-- ===== 質問 ===== -->
  <section class="screen" id="s-quiz" hidden>
    <div class="qtop">
      <button class="back" id="back" type="button" aria-label="前の質問に戻る">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M11 3.5L5.5 9l5.5 5.5" stroke="#4F6478" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="bar"><i id="bar"></i></div>
      <div class="count" id="count"></div>
    </div>
    <div class="card q" id="q"></div>
  </section>

  <!-- ===== 結果 ===== -->
  <section class="screen" id="s-result" hidden></section>
</div>

<script>
/* ============================================================
   設定
   ============================================================ */
var CONFIG = {
  // 公式LINEのベーシックID（page.line.me/wvr6857m で確認済み）
  lineId: '@wvr6857m',
  // 送る文面の先頭につける見出し。担任がトーク一覧で見分けるための目印
  msgTitle: '【今日の敵診断】'
};

/* 公式LINEのトーク画面を、文面を入れた状態で開くリンク。
   IDの「@」はエンコードしない（公式アカウントのページ自身が使っている形に合わせている）。
   スマホのLINEでだけ動く。パソコンのブラウザではLINEのトップページに飛ぶ（仕様） */
function lineHref(text){
  return 'https://line.me/R/oaMessage/' + CONFIG.lineId + '/?' + encodeURIComponent(text);
}

/* ============================================================
   敵
   kind … どんな敵か（「こんなときに現れる」に出す）／line … 敵のセリフ
   plan … 今日の作戦／weak … 倒し方のコツ（WAGONの価値につながる一言）
   名前・種類・セリフは2026-09-17にユーザーが決めたもの
   ============================================================ */
var ENEMIES = {
  scroll: {
    name:'スクロール|魔人', color:['#EFE9FB','#7B5CC4'],
    kind:'スマホをつい見続けてしまう',
    line:'次にもっと面白いのがあるかもよ？',
    plan:'スマホを手の届かない所に置いて、1問だけ解く',
    weak:'やることが「この1問」と決まっていると、スマホに手がのびる前に終わります。'
  },
  yama: {
    name:'やること山盛り|スライム', color:['#E5F5EA','#2E9B57'],
    kind:'実習や記録で、時間・余力がなくなる',
    line:'ひとつ終わったら、次のお仕事です！',
    plan:'受け持ちの患者さんの病気の問題を、1問だけ解く',
    weak:'実習で見た病気と国試の問題がつながるたびに、山が少しずつ低くなっていきます。'
  },
  maigo: {
    name:'どこから迷子|ゴースト', color:['#E6F3FB','#3A8FC9'],
    kind:'何から勉強すればよいか分からない',
    line:'あっちも大事。こっちも大事。で、どこから？',
    plan:'今日やる1問を、先に決めてしまう',
    weak:'今日やることが決まった瞬間に、すっと姿を消します。'
  },
  matome: {
    name:'まとめて満足|エイリアン', color:['#EAF6E4','#5B9E3A'],
    kind:'ノートをまとめて終わってしまう',
    line:'このノート、見ているだけで達成感！',
    plan:'まとめるのをやめて、まず1問解く',
    weak:'先に問題を解いて、間違えたところだけ書き足すと、自分の星に帰っていきます。'
  },
  zombie: {
    name:'丸暗記ループ|ゾンビ', color:['#EEF1F7','#6A7BA8'],
    kind:'理由がつながらないまま、丸暗記しようとする',
    line:'忘れた？ じゃあ、また最初から丸暗記だ！',
    plan:'「なぜそうなる？」をひとつつなげる',
    weak:'しくみから理解すると、聞かれ方が変わっても答えられるようになり、ループが止まります。'
  },
  tanuki: {
    name:'なるほど|化け狸', color:['#FBEFE3','#A8672F'],
    kind:'分かったつもりで終わってしまう',
    line:'答えを見れば分かるし、大丈夫でしょ！',
    plan:'解説を閉じて、ひとつ答えてみる',
    weak:'解説を読んだあとに、自分で答える1問をはさむと、化けの皮がはがれます。'
  }
};

/* Q2で「今日は勉強が進んでいる」を選んだ日の結果。敵は出さず、腕試しの1問へ */
var NO_ENEMY = {
  name:'今日は|敵なし', color:['#FFF6DC','#C8901C'],
  kind:'勉強をジャマするものが、見当たらない日',
  line:'ジャマするやつは、今日はいないみたいです。',
  plan:'調子のいい日は、少し難しい1問で腕試し',
  weak:'解ける日に、少し上の問題に当たっておくと、本番で崩れにくくなります。'
};

/* 同点のときに優先する順（Q4→Q3→Q5→Q2 で、その問で選んだ敵を優先したあとの最後の決め手） */
var ENEMY_ORDER = ['scroll','yama','maigo','matome','zombie','tanuki'];

/* ============================================================
   質問
   p … 点が入る敵と点数。いちばん点の高い敵が「今日の敵」
   short … LINEに送る文面での表記
   点の入り方は、全256通りの答えで6体とも14〜19%になるよう調整済み（2026-09-17）
   ============================================================ */
var QUESTIONS = [
  // MBTIは敵を決めるのには使わない。結果に「出会いやすい敵かも」の一言を足すだけ
  { id:'mbti', label:'MBTI', q:'あなたのMBTIは？', sub:'わからなければ「わからない」でだいじょうぶです', grid:4,
    opts:['INTJ','INTP','ENTJ','ENTP','INFJ','INFP','ENFJ','ENFP',
          'ISTJ','ISFJ','ESTJ','ESFJ','ISTP','ISFP','ESTP','ESFP']
      .map(function(m){ return { t:m, mbti:m }; })
      .concat([{ t:'わからない', wide:true }])
  },
  { id:'today', label:'今日の状態', q:'今日のあなたに近いのは？',
    opts:[
      { t:'実習や課題で、勉強の時間がない',   short:'時間がない',       p:{ yama:2 } },
      { t:'時間はあるのに、なかなか進まない', short:'なかなか進まない', p:{ scroll:1, maigo:1 } },
      { t:'勉強はしているのに、手応えがない', short:'手応えがない',     p:{ matome:1, zombie:1, tanuki:1 } },
      { t:'勉強する気分になれない',           short:'気分になれない',   p:{ maigo:1 } },
      // 順調な日は敵を出さず、腕試し（正答率50%前後の1問）に進む
      { t:'今日は勉強が進んでいる',           short:'勉強が進んでいる', none:true }
    ]},
  { id:'before', label:'勉強を始める前', q:'勉強を始める前のあなたは？',
    opts:[
      { t:'「少しだけスマホを見てから」と思う', short:'少しだけスマホを見てから', p:{ scroll:2 } },
      { t:'どの教材や問題集にするか迷う',       short:'教材を迷う',               p:{ maigo:2 } },
      { t:'まずノートを開いて、まとめ始める',   short:'まずノートをまとめる',     p:{ matome:2 } },
      { t:'実習記録や課題が山盛り',             short:'実習記録や課題が山盛り',   p:{ yama:2 } }
    ]},
  { id:'during', label:'勉強しているとき', q:'勉強しているときのあなたは？',
    opts:[
      { t:'教科書の内容を、ノートに写している',         short:'教科書をノートに写す',   p:{ matome:2 } },
      { t:'病名と症状を、セットで丸ごと覚えている',     short:'病名と症状を丸ごと覚える', p:{ zombie:2 } },
      { t:'解説を読んで「なるほど」と思い、次に進む',   short:'解説を読んで次に進む',   p:{ tanuki:2 } },
      { t:'調べもののつもりが、別のアプリを開いている', short:'別のアプリを開いている', p:{ scroll:2 } }
    ]},
  { id:'exam', label:'模試や過去問', q:'模試や過去問を解いているとき、どうなりがち？',
    opts:[
      { t:'見たことがある言葉なのに、聞かれ方が変わると選べない',         short:'聞かれ方が変わると選べない', p:{ zombie:2 } },

/* この日に出す質問の並び。「今日は勉強が進んでいる」を選んだ日は、
   敵を決める3問（Q3〜Q5）をとばして、分野の質問へ進む */
var SKIP_WHEN_NONE = ['before', 'during', 'exam'];
function flow(){
  var t = QUESTIONS[0].id === 'today' ? 0 : QUESTIONS.findIndex(function(q){ return q.id === 'today'; });
  var a = answers[t];
  var none = (a != null) && !!QUESTIONS[t].opts[a].none;
  var list = [];
  QUESTIONS.forEach(function(q, i){
    if (none && SKIP_WHEN_NONE.indexOf(q.id) !== -1) return;
    list.push(i);
  });
  return list;
}

$('back').addEventListener('click', function(){
  var list = flow();
  var pos = list.indexOf(qi);
  if (pos > 0){ qi = list[pos - 1]; renderQ(); }
});

function renderQ(){
  var q = QUESTIONS[qi];
  var list = flow();
  var pos = list.indexOf(qi);
  $('bar').style.width = (pos / list.length * 100) + '%';
  $('count').textContent = (pos + 1) + '/' + list.length;
  $('back').disabled = (pos === 0);
  var el = $('q');
  el.innerHTML =
    '<p class="num">Q' + (pos + 1) + '</p>' +
    '<h2>' + esc(q.q) + '</h2>' +
    (q.sub ? '<p class="sub">' + esc(q.sub) + '</p>' : '') +
    '<div class="opts' + (q.grid ? ' grid' + q.grid : '') + '">' +
      q.opts.map(function(o, i){
        return '<button type="button" class="opt' + (o.wide ? ' wide' : '') +
               (answers[qi] === i ? ' on' : '') + '" data-i="' + i + '">' + esc(o.t) + '</button>';
      }).join('') +
    '</div>';
  el.classList.remove('screen'); void el.offsetWidth; el.classList.add('screen');
}

var busy = false;
$('q').addEventListener('click', function(e){
  var b = e.target.closest('.opt');
  if (!b || busy) return;
  busy = true;
  answers[qi] = +b.getAttribute('data-i');
  Array.prototype.forEach.call(this.querySelectorAll('.opt'), function(x){ x.classList.remove('on'); });
  b.classList.add('on');
  setTimeout(function(){
    busy = false;
    var list = flow();
    var pos = list.indexOf(qi);
    if (pos < list.length - 1){ qi = list[pos + 1]; renderQ(); }
    else { showResult(); }
  }, 220);
});

/* ============================================================
   判定
   ============================================================ */
function picked(id){
  for (var i = 0; i < QUESTIONS.length; i++){
    // とばした質問は空の答えを返す（呼び出し側で .p や .none を見るだけにする）
    if (QUESTIONS[i].id === id) return (answers[i] == null) ? {} : QUESTIONS[i].opts[answers[i]];
  }
  return {};
}

function judge(){
  var score = {};
  ENEMY_ORDER.forEach(function(k){ score[k] = 0; });
  QUESTIONS.forEach(function(q, i){
    if (answers[i] == null) return;   // とばした質問は数えない
    var p = q.opts[answers[i]].p || {};
    Object.keys(p).forEach(function(k){ score[k] += p[k]; });
  });
  var max = Math.max.apply(null, ENEMY_ORDER.map(function(k){ return score[k]; }));
  var cand = ENEMY_ORDER.filter(function(k){ return score[k] === max; });
  // 同点：TIE_QUESTIONS の順に、その質問で点が入った敵に絞る
  for (var t = 0; t < TIE_QUESTIONS.length && cand.length > 1; t++){
    var p = picked(TIE_QUESTIONS[t]).p || {};
    var f = cand.filter(function(k){ return p[k]; });
    if (f.length) cand = f;
  }
  return cand[0];
}

/* ============================================================
   専任スタッフに送る前の項目
   ============================================================ */
var profile = {};
function profileVisible(f){
  if (!f.when) return true;
  return Object.keys(f.when).every(function(k){ return profile[k] === f.when[k]; });
}
function pv(id){
  var f = PROFILE.filter(function(p){ return p.id === id; })[0];
  return (profileVisible(f) && profile[id]) ? profile[id] : '';
}
function profileLines(){
  var lines = [];
  if (pv('grade')) lines.push('学年：' + pv('grade'));
  // 「WAGONの模試：必修 35〜39点／一般・状況設定 150〜169点」の形。点数を選ばなければ受験の有無だけ
  [['wagon', 'WAGONの模試'], ['other', 'WAGON以外の模試']].forEach(function(m){
    var took = pv(m[0] + 'Mock');
    if (!took) return;
    var scores = [
      pv(m[0] + 'Hisshu') ? '必修 ' + pv(m[0] + 'Hisshu') : '',
      pv(m[0] + 'Ippan')  ? '一般・状況設定 ' + pv(m[0] + 'Ippan') : ''
    ].filter(Boolean).join('／');
    lines.push(m[1] + '：' + (scores || took));
  });
  if (pv('member')) lines.push('WAGONの利用：' + pv('member'));
  return lines;
}

/* 担任はこのメッセージを見て、問題DBから「今日の分野」の1問を選び、
   返信DBの「敵ごとの解き方」と「会員向けの動画」を添えて返す */
function buildMessage(key){
  var lines = [
    CONFIG.msgTitle,
    key ? '今日の敵：' + ENEMIES[key].name.replace('|', '') : '今日の敵：なし（腕試し）',
    '今日の分野：' + picked('area').t,
    ''
  ];
  // 敵なしの日は、正答率50%前後の問題を送る
  if (!key) lines.splice(3, 0, '問題の希望：正答率50%前後の1問');
  var pl = profileLines();
  if (pl.length) lines = lines.concat(pl, ['']);
  lines.push('MBTI：' + (picked('mbti').mbti || 'わからない'));
  QUESTIONS.forEach(function(q, i){
    if (q.id === 'mbti' || q.id === 'area' || answers[i] == null) return;   // とばした質問は出さない
    var o = q.opts[answers[i]];
    lines.push(q.label + '：' + (o.short || o.t));
  });
  lines.push('', key ? 'この敵を倒す、今日の1問をください。' : '腕試しの1問をください。');
  return lines.join('\n');
}

    '<div class="card sec">' +
      '<h2>' + (key ? '今日の作戦' : '今日のおすすめ') + '</h2>' +
      '<p class="plan-main"><span class="hl">' + esc(e.plan) + '</span></p>' +
      '<p class="weak"><b>' + (key ? '倒し方のコツ：' : 'ねらい：') + '</b>' + esc(e.weak) + '</p>' +
    '</div>' +

    // 問題はページに出さず、LINEで担任から受け取る（LINEに戻ってくる理由にする）
    '<div class="card send">' +
      '<h2>' + (key ? '今日の1問を、<br>専任スタッフから受け取る' : '腕試しの1問を、<br>専任スタッフから受け取る') + '</h2>' +
      '<p class="body">' + (key
        ? '今日の敵に合わせた<b>' + esc(area) + 'の1問</b>を、倒し方のコツといっしょに、専任スタッフがLINEでお送りします。'
        : '<b>' + esc(area) + 'の、正答率50%前後の1問</b>を、専任スタッフがLINEでお送りします。') + '</p>' +
      // サブスクWAGON受講中を選んだ人には出さない（refreshで切りかえる）
      '<p class="subsc" id="subsc">毎日の敵に合わせて、<b>見るところと解く問題を担任が決めてくれる</b>のが、サブスクWAGONです。</p>' +
      '<div class="pf">' +
        '<p class="pf-head">あてはまるものをタップすると、いっしょに送れます</p>' +
        PROFILE.map(function(f){
          return '<div class="pf-row" data-f="' + f.id + '"' + (profileVisible(f) ? '' : ' hidden') + '>' +
                   '<p class="pf-lbl">' + esc(f.label) + '</p>' +
                   '<div class="pf-chips">' +
                     f.opts.map(function(o){
                       return '<button type="button" class="chip" aria-pressed="false" data-v="' + esc(o) + '">' + esc(o) + '</button>';
                     }).join('') +
                   '</div>' +
                 '</div>';
        }).join('') +
        '<p class="pf-note">選ばなくても送れます</p>' +
      '</div>' +
      '<a class="btn line" id="send" href="#">LINEで今日の1問を受け取る</a>' +
      '<p class="how">LINEが開いたら、そのまま送信してください</p>' +
      '<details class="msg">' +
        '<summary>送られる内容を見る・うまく開かないとき</summary>' +
        '<pre id="msg"></pre>' +
        '<button type="button" class="copy" id="copy">内容をコピーする</button>' +
        '<p class="note">コピーしたら、WAGONのLINEのトークに貼りつけて送ってください。</p>' +
      '</details>' +
    '</div>' +

    '<button type="button" class="btn ghost" id="retry">もう一度、敵をさがす</button>';

  show('s-result');

  var msg = '';
  function refresh(){
    msg = buildMessage(key);
    $('send').href = lineHref(msg);
    $('msg').textContent = msg;
    $('subsc').hidden = (pv('member') === 'サブスクWAGON（受講中）');
    Array.prototype.forEach.call(document.querySelectorAll('.pf-row'), function(row){
      var f = PROFILE.filter(function(p){ return p.id === row.getAttribute('data-f'); })[0];
      row.hidden = !profileVisible(f);
    });
  }
  refresh();

  // 送る前の項目
  document.querySelector('.pf').addEventListener('click', function(ev){
    var chip = ev.target.closest('.chip');
    if (!chip) return;
    var row = chip.closest('.pf-row');
    var id = row.getAttribute('data-f');
    var val = chip.getAttribute('data-v');
    var on = chip.getAttribute('aria-pressed') !== 'true';
    profile[id] = on ? val : null;   // もう一度押すと選択を外せる
    Array.prototype.forEach.call(row.querySelectorAll('.chip'), function(c){
      c.setAttribute('aria-pressed', (on && c === chip) ? 'true' : 'false');
    });
    refresh();
  });

  $('send').addEventListener('click', function(){
    track('diag_send', {
      method:'line', enemy: key || 'none', area: area,
      grade: profile.grade || 'none', wagon_mock: profile.wagonMock || 'none',
      other_mock: profile.otherMock || 'none', member: profile.member || 'none'
    });
  });
  $('copy').addEventListener('click', function(){
    var btn = this;
    var done = function(){
      btn.textContent = 'コピーしました';
      btn.classList.add('done');
      track('diag_send', { method:'copy', enemy: key || 'none' });
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(msg).then(done, fallback);
    } else { fallback(); }
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = msg; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch(err){}
      document.body.removeChild(ta);
    }
  });
  $('retry').addEventListener('click', function(){ show('s-intro'); });
}
</script>
</body>
</html>
